name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ github.token }}

      - name: Lint（gitleaks, actionlint, ShellCheck, typos, mise.toml の tool pin 検証, main checkout 防御 hook の自己テスト）
        run: mise run ci:lint

      - name: APM package を検証
        run: mise run ci:apm
