# twin-soul の mise 設定
# `mise install` で必要なツールとランタイムをセットアップする

[settings]
pin = true

[tools]
"pipx:apm-cli" = "0.32.0"

# CI: shell script、workflow、secret scan、typo check、Markdown のリンク検査、ローカル Actions 実行に使うツール
shellcheck = "0.11.0"
typos = "1.50.3"
actionlint = "1.7.12"
gitleaks = "8.30.1"
act = "0.2.89"
lychee = "0.24.2"

[tasks."ci:lint:mise-tools"]
description = "mise.toml [tools] が x.y.z 完全一致の pin かどうかを検証する"
run = "bash skills/mise-guide/scripts/check-tool-pins.sh"

[tasks."ci:lint:shell"]
description = "scripts/**/*.sh と skills/**/**/*.sh を ShellCheck で検証する"
run = "bash scripts/ci/run-shellcheck.sh"

[tasks."ci:lint:hooks"]
description = "main checkout 防御 hook の判定自己テストと stdin smoke"
run = "python3 scripts/hooks/guard-main-checkout.py --self-test && bash scripts/hooks/smoke-hook-stdin.sh"

[tasks."ci:lint:skill-scripts"]
description = "skill に同梱した script のテストを実行する"
run = "python3 skills/verification-loop/scripts/test_check_evidence.py && bash skills/mise-guide/scripts/run-check-tool-pins-tests.sh"

[tasks."ci:apm"]
description = "APM で skill を同期し（gitignore された展開先を生成）、audit と必要な lockfile の状態を検証する"
run = "apm install --target cursor,claude && apm audit --ci --no-policy"

[tasks."ci:lint:typos"]
description = "typos でスペルミスを検出する"
run = "typos"

[tasks."ci:lint:actionlint"]
description = "GitHub Actions workflow を actionlint で検証する"
run = "actionlint"

[tasks."ci:lint:gitleaks"]
description = "gitleaks で secret leak を検出する"
run = "gitleaks git . --verbose"

[tasks."ci:lint:links"]
description = "lychee で Markdown の相対リンクと見出しアンカーを検証する"
run = "lychee --no-progress ."

[tasks."ci:lint:docs"]
description = "README の skill 一覧とレビュー出力テンプレートの表記を検証する"
run = "python3 scripts/ci/check-doc-consistency.py"

[tasks."ci:lint"]
description = "静的チェックをまとめて実行する"
run = "bash skills/mise-guide/scripts/check-tool-pins.sh && gitleaks git . --verbose && actionlint && bash scripts/ci/run-shellcheck.sh && python3 scripts/hooks/guard-main-checkout.py --self-test && bash scripts/hooks/smoke-hook-stdin.sh && python3 skills/tech-intro/scripts/check-html.py --self-test && typos && lychee --no-progress . && python3 scripts/ci/check-doc-consistency.py && python3 skills/verification-loop/scripts/test_check_evidence.py && bash skills/mise-guide/scripts/run-check-tool-pins-tests.sh"

[tasks."ci:act"]
description = "act で CI の lint job をローカルで実行する（Docker が必要。追加引数例: mise run ci:act -- -v）"
run = "bash scripts/ci/act-lint.sh"
