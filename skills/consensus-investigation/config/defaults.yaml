# consensus-investigation の既定値。
# 起動時の指定が最優先。`investigator_model` の空文字は未設定ではなく、実行環境の既定モデルを使う意味である。
# モデル識別子は実行ツールが受け付ける文字列をそのまま書く（特定製品の slug はハードコードしない）。

# 並列起動する調査サブエージェントの数。奇数にする（二値の判定投票で同数にならない）。
agent_count: 3

# 調査サブエージェントに渡す model 指定。空なら実行環境の既定モデルに従う。
# 同じ間違え方を減らしたい場合は、起動時の指定で調査サブエージェントごとに別モデルを渡してよい。
investigator_model: ""
