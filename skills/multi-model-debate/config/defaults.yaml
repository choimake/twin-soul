# multi-model-debate の既定値。起動時の指定が最優先。
# モデル識別子は、呼び出しに使うツールが受け付ける文字列をそのまま書く。

# 議論のラウンド数の上限。ラウンド 1（独立案）を含む。全席が「変更なし」になればその前に止める。
max_rounds: 2

# 議論役の席。2〜3 個。runner は呼び出しに使うツール（claude / codex / agy / cursor-agent など）。
# 空なら、起動時に指定が無いときユーザーに聞く。
# 例:
# seats:
#   - { runner: claude, model: <モデル> }
#   - { runner: codex, model: <モデル> }
seats: []
