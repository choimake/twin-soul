# multi-model-debate の設定。skill は議論を始めるときにこのファイルを読む。
# 起動時の指定があれば、そちらを優先する。
# 使えるツールとモデルは環境ごとに違うので、コミットせずルートの .gitignore に入れる。

# 議論役の席。2〜3 個。runner は議論役を呼ぶ CLI（claude / codex / agy / cursor-agent など）、
# model はその CLI が受け付ける識別子をそのまま書く。同じ組を 2 席に置かない。
# 空なら、skill はその場で席を聞く。
# 例:
# seats:
#   - { runner: claude, model: opus }
#   - { runner: codex, model: <モデル> }
seats: []

# ラウンド数の上限。ラウンド 1（独立案）を含む。全席が「変更なし」になれば、その前に止まる。
max_rounds: 2

# 議論役 1 席の 1 回の呼び出しの上限（秒）。
timeout_sec: 600

# 何か出力したあと、新しい出力が無いままこの秒数が過ぎたら、回答を出し終えたとみなして止める（秒）。
# 回答を出し終えても終了しないツールがあるため。
idle_sec: 120
